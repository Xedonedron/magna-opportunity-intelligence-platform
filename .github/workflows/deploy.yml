name: Backend CI/CD Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Lewati unit tests dan langsung deploy'
        required: false
        default: false
        type: boolean
      no_cache:
        description: 'Paksa Docker build tanpa cache (--no-cache)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    if: ${{ !github.event.inputs.skip_tests }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          cd backend
          pytest tests/ -v

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test]
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped' || inputs.skip_tests == true)
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          envs: GITHUB_SHA
          script: |
            set -e
            echo "========================================================"
            echo "🚀 Menerima trigger CI/CD untuk Commit: $GITHUB_SHA"
            echo "========================================================"

            TARGET_DIR="${{ secrets.VPS_PROJECT_PATH || '/root/projects/magna-opportunity-intelligence-platform' }}"

            if [ ! -d "$TARGET_DIR" ]; then
              if [ -d "$HOME/projects/magna-opportunity-intelligence-platform" ]; then
                TARGET_DIR="$HOME/projects/magna-opportunity-intelligence-platform"
              elif [ -d "/var/www/magna-opportunity-intelligence-platform" ]; then
                TARGET_DIR="/var/www/magna-opportunity-intelligence-platform"
              else
                echo "❌ Error: Direktori $TARGET_DIR tidak ditemukan di VPS!"
                exit 1
              fi
            fi

            echo "📁 Direktori target: $TARGET_DIR"
            cd "$TARGET_DIR"

            echo "📥 Mengambil perubahan terbaru dari Git..."
            git fetch origin main
            git pull origin main

            echo "⚙️ Menjalankan script deployment..."
            chmod +x scripts/deploy_backend.sh
            NO_CACHE="${{ github.event.inputs.no_cache || 'false' }}" bash scripts/deploy_backend.sh
