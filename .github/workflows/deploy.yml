name: Backend CI/CD Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Paksa Docker build tanpa cache (--no-cache)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend & Celery on VPS
    runs-on: self-hosted
    steps:
      - name: Update and Deploy Backend
        run: |
          set -e
          echo "========================================================"
          echo "🚀 Menerima trigger CI/CD untuk Commit: $GITHUB_SHA"
          echo "========================================================"

          # Direktori project MOIP di VPS
          TARGET_DIR="/magna-opportunity-intelligence-platform"
          if [ ! -d "$TARGET_DIR" ]; then
            if [ -d "$HOME/projects/magna-opportunity-intelligence-platform" ]; then
              TARGET_DIR="$HOME/projects/magna-opportunity-intelligence-platform"
            elif [ -d "/root/projects/magna-opportunity-intelligence-platform" ]; then
              TARGET_DIR="/root/projects/magna-opportunity-intelligence-platform"
            fi
          fi

          echo "📁 Masuk ke direktori: $TARGET_DIR"
          cd "$TARGET_DIR"

          echo "📥 Mengambil perubahan terbaru dari Git..."
          git fetch origin main
          git pull origin main

          echo "⚙️ Menjalankan script deployment..."
          chmod +x scripts/deploy_backend.sh
          NO_CACHE="${{ github.event.inputs.no_cache || 'false' }}" bash scripts/deploy_backend.sh
