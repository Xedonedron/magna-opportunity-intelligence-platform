[project]
name = "moip-backend"
version = "0.1.0"
description = "Magna Opportunity Intelligence Platform - Backend Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.10.1",
    "email-validator>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.1",
    "google-auth>=2.37.0",
    "google-auth-oauthlib>=1.2.1",
    "google-api-python-client>=2.156.0",
    "redis>=5.2.1",
    "celery>=5.4.0",
    "python-multipart>=0.0.20",
    "langgraph>=1.2.0",
    "langchain>=0.3.14",
    "langchain-google-genai>=2.0.0",
    "google-genai>=0.1.0",
    "langchain-community>=0.4.0",
    "tavily-python>=0.5.0",
    "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
