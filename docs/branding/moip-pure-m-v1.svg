<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cobalt to Sky Cyan Gradient (Foundation & Intelligence) -->
    <linearGradient id="m1-grad-primary" x1="40" y1="50" x2="160" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Warm Coral / Magenta Dot Gradient (Opportunity Discovery) -->
    <linearGradient id="m1-grad-dot" x1="135" y1="78" x2="165" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="60%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Subtle soft shadow -->
    <filter id="m1-glow" x="120" y="65" width="60" height="60" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#F43F5E" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="200" height="200" rx="36" fill="#FFFFFF" />

  <!-- The Modern M Mark -->
  <!-- Left Arch: Pure Cobalt to Ocean Flow -->
  <path
    d="M 52 148 V 74 C 52 56 66 48 80 56 L 102 112 C 104.5 118 111.5 118 114 112 L 132 68 C 137 54 148 50 156 60"
    stroke="url(#m1-grad-primary)"
    stroke-width="17"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right Vertical Stem (Forms the 'i' for Intelligence) -->
  <path
    d="M 152 98 V 148"
    stroke="#38BDF8"
    stroke-width="17"
    stroke-linecap="round"
  />

  <!-- Opportunity Discovery Accent Beacon (Dot of the 'i' & Focal Point) -->
  <circle
    cx="152"
    cy="76"
    r="10"
    fill="url(#m1-grad-dot)"
    filter="url(#m1-glow)"
  />
</svg>
