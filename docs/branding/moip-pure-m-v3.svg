<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dynamic Seamless Gradient: Royal Blue -> Sky Cyan -> Warm Magenta -->
    <linearGradient id="m3-ribbon" x1="45" y1="140" x2="155" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Warm Coral Accent Gradient -->
    <linearGradient id="m3-coral-accent" x1="130" y1="50" x2="160" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="200" height="200" rx="36" fill="#FFFFFF" />

  <!-- Single Continuous Pure M Ribbon -->
  <!-- Left to Center Fold -->
  <path
    d="M 52 148 V 74 C 52 52 74 46 88 64 L 100 82"
    stroke="#2563EB"
    stroke-width="17"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center Valley to Right Pillar with Gradient -->
  <path
    d="M 100 82 L 112 64 C 126 46 148 52 148 74 V 148"
    stroke="url(#m3-coral-accent)"
    stroke-width="17"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Overlapping Center Intelligence Apex Intersection -->
  <path
    d="M 88 108 L 100 124 L 112 108"
    stroke="#38BDF8"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
