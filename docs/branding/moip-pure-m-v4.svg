<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Left Pillar Gradient (Cobalt Foundation) -->
    <linearGradient id="m4-blue-pillar" x1="45" y1="55" x2="45" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Center Loop Gradient (Cyan Transition) -->
    <linearGradient id="m4-cyan-loop" x1="50" y1="60" x2="135" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Warm Coral / Magenta Beacon (Opportunity Discovery) -->
    <linearGradient id="m4-coral-dot" x1="135" y1="70" x2="165" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <filter id="m4-dot-glow" x="126" y="66" width="46" height="46" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F43F5E" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Clean Canvas -->
  <rect width="200" height="200" rx="36" fill="#FFFFFF" />

  <!-- Left Stem: Rounded Vertical Pillar -->
  <rect x="44" y="68" width="18" height="80" rx="9" fill="url(#m4-blue-pillar)" />

  <!-- Center Arch and Valley: Smooth Rounded Tubular Arc -->
  <path
    d="M 53 77 C 53 52 74 46 88 62 L 102 84 C 104.5 88 111.5 88 114 84 L 126 64 C 138 48 155 54 155 76"
    stroke="url(#m4-cyan-loop)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right Stem: Grounding Vertical Pillar -->
  <rect x="146" y="96" width="18" height="52" rx="9" fill="#38BDF8" />

  <!-- Opportunity Discovery Aperture Beacon (Warm Coral-Magenta) -->
  <circle
    cx="149"
    cy="75"
    r="11"
    fill="url(#m4-coral-dot)"
    filter="url(#m4-dot-glow)"
  />
</svg>
